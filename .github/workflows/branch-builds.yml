# Builds a commit for macOS, Windows and Linux when a tag named release-* is pushed for it, and publishes the
# packages as a GitHub pre-release of that tag. These builds are not versioned, so every build is "4.5 alpha"
# (0.4.5-alpha.*) and the release is named after the branch, the commit and the build time.
#
# Only the newest KEEP_RELEASES releases of each branch are kept, and the releases of deleted branches are
# deleted as well. The release-* tags themselves are never deleted.
#
# macOS builds are signed ad-hoc (no Developer ID / notarization), see the release notes for how to open them.
name: Branch builds

on:
  push:
    tags:
      - 'release-*'

permissions:
  contents: write

concurrency:
  # Pushing a tag again (git push --force) cancels the build of the commit it pointed to before
  group: branch-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shown as "4.5 alpha"
  ALPHA_VERSION: 0.4.5
  KEEP_RELEASES: 3

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      branch: ${{ steps.meta.outputs.branch }}
      title: ${{ steps.meta.outputs.title }}
      built: ${{ steps.meta.outputs.built }}
    steps:
      - uses: actions/checkout@v7
        with:
          # All branches, to find the one the tagged commit is on
          fetch-depth: 0
      - id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          stamp="$(date -u +%Y%m%d%H%M)"
          built="$(date -u '+%Y-%m-%d %H:%M UTC')"
          # The branch the tagged commit is on. If several contain it (e.g. after a merge), the one with the
          # fewest commits after it, preferring the default branch. Empty if the commit is on no branch.
          branch="$(git for-each-ref --contains "$GITHUB_SHA" --format='%(refname:lstrip=3)' refs/remotes/origin \
            | { grep -vx HEAD || true; } \
            | while read -r b; do
                echo "$(git rev-list --count "${GITHUB_SHA}..origin/${b}") $([ "$b" = "$DEFAULT_BRANCH" ] && echo 0 || echo 1) ${b}"
              done \
            | sort -k1,1n -k2,2n -k3,3 | awk 'NR == 1 { print $3 }')"
          echo "Tagged commit is on branch: ${branch:-(none)}"
          # Semver pre-release; the "g" keeps an all-digit hash from becoming a number with leading zeros
          echo "version=${ALPHA_VERSION}-alpha.${stamp}.g${short_sha}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "title=${ALPHA_VERSION#0.} alpha · ${branch:-no branch} · ${short_sha} · ${built}" >> "$GITHUB_OUTPUT"
          echo "built=${built}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g yarn
      - run: yarn install --frozen-lockfile
      # Builds the app from a clean clone of the commit in build/clean
      - run: yarn prepare-release
      - run: yarn package branch
        env:
          BUILD_VERSION: ${{ needs.meta.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.name }}
          path: |
            build/clean/build/*.dmg
            build/clean/build/MQTT*.exe
            build/clean/build/*.AppImage
            build/clean/build/*.deb
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ needs.meta.outputs.title }}
          VERSION: ${{ needs.meta.outputs.version }}
          BUILT: ${{ needs.meta.outputs.built }}
          BRANCH: ${{ needs.meta.outputs.branch }}
        run: |
          subject="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.message | split("\n")[0]')"
          cat > notes.md <<EOF
          - **Branch:** \`${BRANCH:-none}\`
          - **Commit:** [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) ${subject}
          - **Built:** ${BUILT} · [build log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - **Version:** \`${VERSION}\`

          Unversioned build ("${ALPHA_VERSION#0.} alpha"), not for production use. Only the newest ${KEEP_RELEASES} releases of a branch are kept, and they are deleted with the branch.

          | Platform | File |
          |---|---|
          | macOS (Apple Silicon and Intel) | \`*-universal.dmg\` |
          | Windows | \`*Setup*.exe\` (installer) or the other \`.exe\` (portable) |
          | Linux | \`.AppImage\` or \`.deb\` (x64, arm64) |

          **macOS:** the app is signed ad-hoc, not notarized. After copying it to Applications, open it once via
          *System Settings → Privacy & Security → Open Anyway*, or run
          \`xattr -dr com.apple.quarantine "/Applications/MQTT Explorer.app"\`.

          **Windows:** the installer is not code signed, so SmartScreen asks for confirmation.
          EOF
          if [ -n "$BRANCH" ]; then
            # Lets the prune steps find the releases of a branch, not shown in the rendered notes
            echo "<!-- branch-build: ${BRANCH} -->" >> notes.md
          fi
          ls -la packages
          # A tag that was pushed again gets a new release
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TITLE" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
      # Runs only after the new release exists, so a failed build never removes the previous ones
      - name: Prune old releases of this branch
        if: needs.meta.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          MARKER: '<!-- branch-build: ${{ needs.meta.outputs.branch }} -->'
        run: |
          # Newest first, without the release just created, which always stays
          older="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select((.body // "" | contains($ENV.MARKER)) and .tag_name != $ENV.TAG) | "\(.created_at) \(.tag_name)"' \
            | sort -r | cut -d' ' -f2)"
          echo "Older releases of this branch, newest first:"
          echo "${older:-(none)}"
          echo "$older" | tail -n +"$KEEP_RELEASES" | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting the release of $tag (the tag is kept)"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes \
              || echo "::warning::Could not delete the old release $tag"
          done

  # Deletes the releases of branches that no longer exist. Runs with every release build, so a deleted branch's
  # releases go away with the next release-* tag.
  prune-deleted-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases of deleted branches
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branches="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')"
          # An incomplete branch list would delete the releases of existing branches
          if ! grep -qxF "$DEFAULT_BRANCH" <<< "$branches"; then
            echo "::error::The branch list does not contain the default branch ${DEFAULT_BRANCH}, not deleting anything"
            exit 1
          fi
          # "<branch> <tag>" for every release made by this workflow (see the marker in the release job)
          builds="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | (.body // "" | capture("<!-- branch-build: (?<branch>\\S+) -->")) as $m | "\($m.branch) \(.tag_name)"')"
          deleted=0
          while read -r branch tag; do
            [ -n "$tag" ] || continue
            grep -qxF "$branch" <<< "$branches" && continue
            echo "Deleting the release of $tag (the tag is kept), its branch $branch no longer exists"
            deleted=$((deleted + 1))
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes \
              || echo "::warning::Could not delete the release $tag of a deleted branch"
          done <<< "$builds"
          echo "Checked $(grep -c . <<< "$builds" || true) releases against $(grep -c . <<< "$branches") branches, deleted ${deleted}"
